schema:
  entity_types:
    EQUIPMENT: A complete or independently functional equipment item, platform, system, device, weapon, or identified model. Organization, location, deployment mode, and country or force names are not equipment.
    MODULE: A physical or functional subsystem, component, unit, payload, munition, warhead, launcher, or part explicitly playing a constituent role in context. A term that can be independent equipment may be MODULE when the current sentence presents it as a component of a larger platform.
    TECH_SCHEME: A non-physical technical method, architecture, operating regime, algorithm, process, information state, parameter concept, capability concept, or named engineering approach.
    METRIC: A self-contained technical specification containing an attribute and its value, range, threshold, grade, or necessary local condition. Numeric weapon components such as warheads or charges are MODULE, not METRIC.
  relation_types:
    USES:
      definition: The head explicitly uses, adopts, carries, mounts, deploys, equips, installs, or configures the tail for a function. For EQUIPMENT-to-EQUIPMENT relations, carrying/mounting/deployment wording such as 搭载/部署/挂载/装备/配装 is USES, not PART_OF. Do not reverse control or scheduling semantics to force a USES relation.
