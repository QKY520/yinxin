execution:
  phase: P5_DOMAIN_REPLICATION
  authorized: true
  human_gate: P5_DOMAIN_REPLICATION_APPROVED
  approval_record: "Human approval in chat on 2026-07-24: paid GPU/card mode is enabled. Scope: bounded P5 domain replication A/B/C/D on domain_test K=5 seeds 43 and 44 only; no prompt/glossary/RAG/verifier tuning; no E/E-prime; D uses existing P5 D RAG replay manifest."
