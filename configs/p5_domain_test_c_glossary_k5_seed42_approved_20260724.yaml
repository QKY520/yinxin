run_id: p5-domain-test-c-glossary-k5-seed42-draft
config_name: C_knn_glossary_domain_test_p5_draft

execution:
  phase: P5_DOMAIN_PILOT
  authorized: true
  human_gate: P5_DOMAIN_PILOT_APPROVED
  approval_record: "Human approval in chat on 2026-07-24: card/GPU mode is enabled, continue. Scope: bounded P5 domain_test pilot A/B/C/D K=5 seed=42 only; change execution metadata only; no prompt/glossary/RAG/verifier tuning."
  model_calls_allowed: true
  gpu_required: true
  explicit_exclusions:
    - prompt_tuning_from_domain_test
    - glossary_tuning_from_domain_test
    - rag_tuning_from_domain_test
    - verification
    - E_or_Eprime

data:
  dataset: domain_test
  support_path: /root/autodl-tmp/data/domain_support.jsonl
  query_path: /root/autodl-tmp/data/domain_test.jsonl

schema:
  task: ner
  entity_types:
    EQUIPMENT: 完整装备、武器平台、系统或型号名称。
    MODULE: 装备的部件、组件、子系统、传感器、载荷或功能模块。
    TECH_SCHEME: 技术体制、制导方式、作战/测试/改进方案或能力方案。
    METRIC: 数值指标、性能参数、射程、速度、重量、时间或数量表达。
  relation_types: {}

examples:
  mode: knn_replay
  k: 5
  seed: 42
  source_per_query_path: /root/project/results/p5/p5_domain_test_b_knn_k5_seed42_per_query.jsonl
  source_note: "Replay B(kNN) example_ids for the same dataset/K/seed to isolate C-B as glossary-only."

glossary:
  path: /root/project/data/domain_dict.jsonl
  max_entries: 20
  match_mode: substring
  source_note: "Frozen glossary from P3 decision records; do not tune from domain_test."

prompt:
  output_instruction: "只返回JSON,不要任何解释,不要markdown代码块"
  retry_suffix: "只返回合法JSON"
  retry_mode: parser_error_aware

parsing:
  drop_invalid_entities: true
  mode: proposal_stage_sanitize
  note: "Match the accepted P3 sanitize setting for config comparability; do not change after domain_test execution starts."

model:
  name: /root/autodl-tmp/models/qwen2.5-7b
  base_url: http://127.0.0.1:8000
  timeout_seconds: 300
  api_key: EMPTY

generation:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 768
  seed: 42

cache:
  dir: /root/project/cache/p5_extraction

outputs:
  dry_run_prompts: /root/project/logs/p5_domain_test_c_glossary_k5_seed42_prompts.jsonl
  manifest: /root/project/logs/p5_domain_test_c_glossary_k5_seed42_manifest.json
  per_query: /root/project/results/p5/p5_domain_test_c_glossary_k5_seed42_per_query.jsonl
  summary: /root/project/results/p5/p5_domain_test_c_glossary_k5_seed42_summary.json
